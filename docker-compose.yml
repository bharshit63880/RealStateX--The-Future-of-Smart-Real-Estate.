services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes: [realstatex_mongo:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: server/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_REQUIRED: "true"
      MONGODB_URI: mongodb://mongo:27017/realstatex
      CLIENT_URL: http://localhost:8080
      DOCUMENT_STORAGE_PATH: /app/server/storage/documents
    volumes: [realstatex_documents:/app/server/storage/documents]
    depends_on:
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
  web:
    build: { context: ., dockerfile: client/Dockerfile }
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  realstatex_mongo:
  realstatex_documents:
